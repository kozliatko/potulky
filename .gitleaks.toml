title = "Potulky — gitleaks konfigurácia"

[extend]
useDefault = true

[allowlist]
description = "Placeholdery a testovacie fixtures, nie sú to reálne secrets (vrátane git histórie)"
paths = [
  '''\.env\.example$''',
  '''backend/server\.test\.js$''',
]
regexes = [
  '''tvoj-token''',
  '''zmen-toto-na-vlastny-tajny-token''',
  '''vlastny-tajny-token''',
]
