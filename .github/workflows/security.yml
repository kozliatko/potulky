name: Security — kontrola citlivých dát

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — sken tajomstiev v kóde a git histórii
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (plná história)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Spusti gitleaks
        run: |
          docker run --rm \
            -v "$(pwd)":/repo \
            zricethezav/gitleaks:latest \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --verbose \
              --redact \
              --exit-code 1

  npm-audit:
    name: npm audit — zraniteľné závislosti (produkčné)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Audit backend (len produkčné závislosti)
        working-directory: backend
        run: |
          npm install --omit=dev --package-lock-only
          npm audit --omit=dev --audit-level=high

      - name: Audit frontend (len produkčné závislosti)
        working-directory: frontend
        run: |
          npm install --omit=dev --package-lock-only
          npm audit --omit=dev --audit-level=high
