name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend — unit testy + coverage (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci
        working-directory: backend
        run: npm ci

      - name: Coverage provider (verzia zhodná s nainštalovaným vitest, bez zmeny lockfile)
        working-directory: backend
        run: npm install --no-save @vitest/coverage-v8@"$(node -p "require('vitest/package.json').version")"

      - name: npm test (s coverage)
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: dummy
          TAVILY_API_KEY: dummy
        run: npm test -- --coverage --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  frontend-build:
    name: Frontend — testy + coverage + build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Coverage provider (verzia zhodná s nainštalovaným vitest, bez zmeny lockfile)
        working-directory: frontend
        run: npm install --no-save @vitest/coverage-v8@"$(node -p "require('vitest/package.json').version")"

      - name: npm test (s coverage)
        working-directory: frontend
        run: npm test -- --coverage --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: npm run build
        working-directory: frontend
        run: npm run build
