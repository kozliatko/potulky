name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend — unit testy + coverage (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci
        working-directory: backend
        run: npm ci

      - name: Coverage provider (bez zmeny lockfile)
        working-directory: backend
        run: npm install --no-save @vitest/coverage-v8@^2.0.0

      - name: npm test (s coverage)
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: dummy
          TAVILY_API_KEY: dummy
        run: npm test -- --coverage --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  frontend-build:
    name: Frontend — testy + coverage + build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Coverage provider (bez zmeny lockfile)
        working-directory: frontend
        run: npm install --no-save @vitest/coverage-v8@^2.0.0

      - name: npm test (s coverage)
        working-directory: frontend
        run: npm test -- --coverage --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: npm run build
        working-directory: frontend
        run: npm run build
