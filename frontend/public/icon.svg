<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#059669"/>
  <!-- Wheels -->
  <circle cx="152" cy="336" r="84" fill="none" stroke="#fff" stroke-width="32"/>
  <circle cx="360" cy="336" r="84" fill="none" stroke="#fff" stroke-width="32"/>
  <!-- Frame: chainstay + seat tube + top tube -->
  <polyline points="152,336 256,192 360,336" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down tube -->
  <line x1="256" y1="192" x2="152" y2="336" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="256" y1="192" x2="230" y2="280" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  <!-- Seat -->
  <line x1="208" y1="168" x2="272" y2="168" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <line x1="240" y1="168" x2="256" y2="192" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="340" y1="224" x2="360" y2="200" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="340" y1="204" x2="380" y2="204" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  <!-- Hub dots -->
  <circle cx="152" cy="336" r="12" fill="#fff"/>
  <circle cx="360" cy="336" r="12" fill="#fff"/>
  <!-- Lightning bolt (e-bike) -->
  <polygon points="292,136 272,172 288,172 268,208 308,165 290,165" fill="#fde68a"/>
</svg>
