services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_SECRET_TOKEN=${VITE_API_SECRET_TOKEN}
    container_name: cyclo-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - app_data:/app/data
    networks:
      - default
      - caddy
    labels:
      caddy: potulky.kozliatko.sk
      caddy.reverse_proxy: "{{upstreams 3001}}"
      caddy.encode: gzip zstd
      caddy.reverse_proxy.transport: http
      caddy.reverse_proxy.transport.read_timeout: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    external: true

volumes:
  app_data:
