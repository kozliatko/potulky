services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclo-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - app_data:/app/data
    networks:
      - default
      - caddy
    labels:
      caddy: potulky.kozliatko.sk
      caddy.@history_path: path /history*
      caddy.basic_auth: "@history_path"
      caddy.basic_auth.admin: "${HISTORY_PASSWORD_HASH}"
      caddy.reverse_proxy: "{{upstreams 3001}}"
      caddy.encode: gzip zstd
      caddy.reverse_proxy.transport: http
      caddy.reverse_proxy.transport.read_timeout: 300s
      caddy.log: ""
      caddy.log.output: stderr
      caddy.log.format: json
      caddy.header.X-Frame-Options: "SAMEORIGIN"
      caddy.header.X-Content-Type-Options: "nosniff"
      caddy.header.Referrer-Policy: "strict-origin-when-cross-origin"
      caddy.header.Strict-Transport-Security: '"max-age=31536000; includeSubDomains"'
      caddy.header.Content-Security-Policy: >-
        "default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*.tile.openstreetmap.org;
        connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org;
        font-src 'self';
        worker-src 'self';
        manifest-src 'self';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'self'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    external: true

volumes:
  app_data:
