services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_SECRET_TOKEN=${VITE_API_SECRET_TOKEN}
    container_name: cyclo-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    # Bez verejného portu — prístup iba cez Caddy.
    # Pre priamy prístup (debug) odkomentuj:
    # ports:
    #   - "8080:3001"
    networks:
      - internal

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: cyclo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # E-mail pre Let's Encrypt notifikácie o expirácii
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL}
    volumes:
      # Let's Encrypt certifikáty — musia byť perzistentné (inak Caddy žiada nový cert pri každom reštarte)
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  # Uloženie Let's Encrypt certifikátov medzi reštartmi
  caddy_data:
  caddy_logs:
