services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cyclo-backend-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cyclo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cyclo-frontend-dev
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_API_SECRET_TOKEN=${VITE_API_SECRET_TOKEN}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cyclo-net

networks:
  cyclo-net:
    driver: bridge
